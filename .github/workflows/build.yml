name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: CLI tests
        run: python -m unittest discover -s tools -v

      - name: Launcher unit tests and release build
        working-directory: launcher
        run: ./gradlew testDebugUnitTest assembleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: cleanos-home-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
